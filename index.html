<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=540, user-scalable=no">
<title>Nav Dock — Launcher Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #1a1a1a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    font-family: 'Inter', system-ui, sans-serif;
  }

  #frame {
    position: relative;
    width: 540px;
    height: 620px;
    overflow: hidden;
    background: #373737;
    background: color(display-p3 0.216 0.216 0.216);
  }

  /* Home screen — always the bottom layer */
  #home-screen {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #000 url('home.png') center / cover no-repeat;
  }

  /* Dim layer over the home/app behind overview surfaces */
  #recents-bg {
    position: absolute;
    inset: 0;
    z-index: 8;
    background: #000000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.26s cubic-bezier(0.22,1,0.36,1);
  }
  #recents-bg.visible {
    opacity: 0.75;
    pointer-events: auto;
  }
  /* lighter dim for the notif/settings peek so the app behind keeps context */
  #recents-bg.light.visible { opacity: 0.4; }

  /* Full-screen opened app */
  #app-screen {
    position: absolute;
    inset: 0;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #app-screen.open {
    opacity: 1;
    pointer-events: auto;
  }
  /* During minimize the app lifts above the overview and zooms into its card */
  #app-screen.minimizing {
    z-index: 15;
    transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }

  /* Horizontal app-switcher: running apps in a row over the home, 40px gaps */
  #app-strip {
    position: absolute;
    top: 0; left: 0;
    height: 620px;
    display: flex;
    gap: 40px;
    z-index: 6;            /* over home, under the dim/overview */
    pointer-events: none;
    will-change: transform;
  }
  #app-strip:not(.active) { display: none; }
  .app-panel { width: 540px; height: 620px; flex: none; }

  /* Recent apps overview — nested inside the recents panel of the viewer.
     Sits between the top status area and the dock reserve at the bottom. */
  #recents-preview {
    position: absolute;
    top: 88px;
    left: 0;
    width: 540px;
    height: 372px;
    z-index: 1;
    display: flex;
    justify-content: center;
    overflow: visible;
    pointer-events: auto;
  }
  /* Recents panel: solid black surface behind the carousel so the home/app
     underneath doesn't show through (matches the notif/qs sheet feel). */
  .panel[data-panel="recents"] {
    background: #000;
    background: color(display-p3 0 0 0);
  }
  /* legacy class hooks kept as no-ops so older callers don't have to be ripped out */
  #recents-preview.visible,
  #recents-preview.exit-up,
  #recents-preview.no-scale { /* no-op now — visibility comes from the panel */ }
  #recents-track {
    display: flex;
    gap: 44px;
    align-items: center;
    will-change: transform;
  }
  .preview-card {
    width: 324px;
    height: 372px;
    border-radius: 18px;             /* rounded card corners */
    flex: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    position: relative;
    overflow: hidden;                /* clip the inner chrome to the rounded card */
  }
  /* App-identifier chip centred at the top of every preview card.
     Sources its image from --app-icon (set per-card in buildRecentsPreview)
     and floats on top of the card body with a soft drop shadow. */
  .preview-card::before {
    content: '';
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--app-icon, rgba(255,255,255,0.18));
    background-size: cover;
    background-position: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.55), 0 1px 2px rgba(0,0,0,0.4);
  }

  /* ============ Viewer carousel: recents | notifications | quick-settings ============ */
  #panels {
    position: absolute;
    inset: 0;                /* full-frame drawer */
    z-index: 11;
    overflow: hidden;
    transform: translateY(100%);
    pointer-events: none;
    transition: transform 0.26s cubic-bezier(0.22,1,0.36,1);
  }
  #panels.open {
    transform: translateY(0);
    pointer-events: auto;
  }
  #panels-track {
    display: flex;
    width: 1620px;         /* three 540 panels side by side */
    height: 100%;
    will-change: transform;
    transition: transform 0.22s cubic-bezier(0.22,1,0.36,1);
  }
  .panel {
    position: relative;
    width: 540px;
    height: 620px;
    flex: none;
    transition: transform 0.22s cubic-bezier(0.22,1,0.36,1);
    /* recents stays transparent (translucent carousel over the dim) */
  }
  /* When the dock has collapsed to dots, shift the panel contents down so
     they end just above the dot strip (using the space that the icon row
     used to occupy). 78px (icon dock) − 22px (dots) = 56px gained. */
  #frame.dock-collapsed .panel { transform: translateY(56px); transition: transform 0.20s cubic-bezier(0.22,1,0.36,1); }
  /* Opaque viewers (notifications, quick-settings) — solid sheet so the
     home/app behind doesn't bleed through, with a tiny grabber header
     and a reserved bottom strip for the dock dots. */
  .panel[data-panel="notif"],
  .panel[data-panel="qs"] {
    background: #111;
    background: color(display-p3 0.07 0.07 0.07);
  }
  /* drawer cells (quick-settings tiles & notification cards) */
  .cell {
    position: absolute;
    background: #2D2D2D;
    background: color(display-p3 0.176 0.176 0.176);
    border-radius: 16px;
  }
  .cell.shadow {
    box-shadow: 0 4px 4px rgba(0,0,0,0.25);
    box-shadow: 0 4px 4px color(display-p3 0 0 0 / 0.25);
  }
  /* Collapsed nav indicator: 5 icons morph into 5 dots. The row scales
     toward the dot strip while fading; the dots fade up at the same time.
     Both children are stacked so the swap is one continuous motion. */
  #dock-row, #dock-dots {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.18s cubic-bezier(0.22,1,0.36,1),
                transform 0.20s cubic-bezier(0.22,1,0.36,1);
    transform-origin: 50% 100%;            /* shrink toward the bottom strip */
  }
  #dock-row  { opacity: 1; transform: scale(1); }
  #dock-dots { opacity: 0; gap: 14px; pointer-events: none; transform: scale(1.6); transform-origin: 50% 50%; }
  #dock.collapsed #dock-row  { opacity: 0; pointer-events: none; transform: scale(0.28); }
  #dock.collapsed #dock-dots { opacity: 1; pointer-events: auto; transform: scale(1); }
  .ndot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.32);
    transition: transform 0.18s cubic-bezier(0.22,1,0.36,1), background 0.18s ease;
  }
  .ndot.on { background: #fff; transform: scale(1.6); }
  /* search & home dots greyed (non-swipeable in option A) */
  .ndot[data-non-viewer] { background: rgba(255,255,255,0.18); }

  /* Solid black plate that sits behind the dock area whenever the dock
     is visible but no committed panel is covering it (i.e. stage-1).
     Once a panel commits, the panel itself provides the background and
     the plate fades out. */
  #dock-plate {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 130px;
    background: #000;
    background: color(display-p3 0 0 0);
    z-index: 19;            /* under #dock (20), above app/dim */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s cubic-bezier(0.22,1,0.36,1);
  }
  /* Modern browsers: turn it on when the dock is revealed AND no panel
     is committed open. */
  #frame:has(#dock.revealed):not(:has(#panels.open)) #dock-plate { opacity: 1; }

  /* ===================== Dock ===================== */
  #dock {
    position: absolute;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(140px);
    width: 464px;
    height: 78px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
    background: rgba(217, 217, 217, 0.2);
    background: color(display-p3 0.851 0.851 0.851 / 0.2);
    border-radius: 40px;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
    transition: transform 0.26s cubic-bezier(0.22,1,0.36,1),
                opacity 0.18s ease,
                height 0.20s cubic-bezier(0.22,1,0.36,1),
                background 0.18s ease;
  }
  /* Collapsed (dots) state — dock visually collapses to just the dot strip
     at the bottom, no pill background. The icon row scales down as it
     fades, so the 5 icons feel like they shrink into the 5 dots. Touch
     anywhere on the dots area expands it back to icon height. */
  #dock.collapsed {
    height: 22px;
    background: transparent;
  }
  #dock.revealed {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  #dock-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 0;
    width: 464px;
    height: 78px;
  }

  /* 5 equal-width slots, each a wide touch area with a 64px icon tray centred.
     Two-step reveal: step 1 = dock slides up flat (CSS on #dock); step 2 = the
     icons morph into an arc (centre highest), via a delayed transform. */
  .dock-icon {
    flex: 1;
    height: 78px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transform: translateY(8px);                  /* flat resting before arc settles */
    transition: transform 0.20s cubic-bezier(0.22,1,0.36,1) 0.10s;
  }
  /* Arc positions: outer 0, mid -6, centre -12 */
  #dock.revealed #dock-row .dock-icon:nth-child(1),
  #dock.revealed #dock-row .dock-icon:nth-child(5) { transform: translateY(0); }
  #dock.revealed #dock-row .dock-icon:nth-child(2),
  #dock.revealed #dock-row .dock-icon:nth-child(4) { transform: translateY(-6px); }
  #dock.revealed #dock-row .dock-icon:nth-child(3) { transform: translateY(-12px); }

  .tray {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(32,32,32,0.35);
    background: color(display-p3 0.125 0.125 0.125 / 0.35);
    transition: transform 0.18s cubic-bezier(0.22,1,0.36,1);
    pointer-events: none;
  }
  .dock-icon.active .tray { transform: scale(1.18); }

  .glyph {
    width: 34px;
    height: 34px;
    display: block;
  }

  /* ===================== Favourites fan-out ===================== */
  #fav-fan {
    position: absolute;
    left: 19px;           /* anchored at the favourites slot, expands rightwards */
    bottom: 119px;        /* 10px higher */
    width: 346px;         /* 4 tiles + 1.5x spacing (30px gaps) */
    height: 64px;
    display: flex;
    justify-content: flex-start;
    gap: 30px;
    align-items: center;
    z-index: 21;
    opacity: 0;
    transform: translateY(16px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.22,1,0.36,1);
  }
  #fav-fan.open {
    opacity: 1;
    transform: translateY(0);
  }
  .fav-tile {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    object-fit: cover;
    background: #222;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    transition: transform 0.16s cubic-bezier(0.22,1,0.36,1);
  }
  .fav-tile.sel { transform: scale(1.28) translateY(-6px); }

  /* ===================== Search (bar + keyboard + results) ===================== */
  #search-overlay {
    position: absolute;
    inset: 0;
    z-index: 25;            /* above the dock, below the edge/toggles */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.24s ease;
  }
  #search-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* results fill the area above the search bar */
  #search-results {
    position: absolute;
    left: 0; top: 64px;
    width: 540px; bottom: 300px;
    padding: 0 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    opacity: 0;
    transition: opacity 0.2s ease 0.06s;
  }
  #search-overlay.open #search-results { opacity: 1; }
  .sr-row {
    height: 64px;
    border-radius: 16px;
    background: rgba(255,255,255,0.10);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    flex: none;
  }
  .sr-ico { width: 40px; height: 40px; border-radius: 11px; background: rgba(255,255,255,0.18); flex: none; }
  .sr-lines { display: flex; flex-direction: column; gap: 8px; }
  .sr-line { height: 11px; border-radius: 6px; background: rgba(255,255,255,0.20); }

  /* search bar — starts at the icon size, expands horizontally */
  #search-bar {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 246px;          /* sits just above the keyboard */
    width: 64px;            /* collapsed = dock icon size */
    height: 48px;
    background: #2A2A2A;
    border-radius: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    overflow: hidden;
    white-space: nowrap;
    transition: width 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  #search-overlay.open #search-bar { width: 500px; }
  #search-bar svg { width: 22px; height: 22px; flex: none; }
  #search-bar .sb-text { font-family: 'Inter', sans-serif; font-size: 18px; color: #8A8A8A; }

  /* QWERTY keyboard — slides up from the bottom (visual only) */
  #keyboard {
    position: absolute;
    left: 0; bottom: 0;
    width: 540px; height: 230px;
    background: #000000;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  #search-overlay.open #keyboard { transform: translateY(0); }
  .kb-row {
    position: absolute;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    height: 56px;
  }
  .kb-cell {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 56px;
    width: 50px;
  }
  .kb-key {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 48px;
    background: #3A3A3A;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 28px;
    color: #DDDDDD;
  }

  /* ===================== Bottom edge / swipe zone ===================== */
  #deadzone {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 16px;
    background: #111111;
    background: color(display-p3 0.067 0.067 0.067);
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 30;
  }
  #swipe-zone {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 16px;
    background: #808080;
    background: color(display-p3 0.5 0.5 0.5);
    border-radius: 8px 8px 0 0;
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 31;
    cursor: grab;
  }

  /* Corner toggle pills */
  .corner-toggle {
    position: absolute;
    top: 8px;
    z-index: 40;
    padding: 4px 8px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: #fff;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
  }
  #dock-fill-toggle { right: 8px; }
  #edge-toggle      { left: 8px; }
  #favs-toggle      { left: 50%; transform: translateX(-50%); }
  #frame.no-favs #fav-fan { display: none; }

  #frame.dock-bare #dock { background: transparent; }
  #frame.show-edges #deadzone,
  #frame.show-edges #swipe-zone { opacity: 0.10; }
</style>
</head>
<body>

<div id="frame">
  <!-- Home screen -->
  <div id="home-screen"></div>

  <!-- Opened app -->
  <div id="app-screen"></div>
  <!-- Horizontal app-switcher strip (swipe left/right on the bottom edge) -->
  <div id="app-strip"></div>

  <!-- Dim layer -->
  <div id="recents-bg"></div>

  <!-- Viewer carousel: recents | notifications | quick-settings -->
  <div id="panels">
    <div id="panels-track">
      <!-- Recents (cards) -->
      <div class="panel" data-panel="recents">
        <div id="recents-preview">
          <div id="recents-track"></div>
        </div>
      </div>
      <!-- Notifications: stacked cards. Content lives between the header
           (~36 px) and the dock-dots reserve (~88 px from bottom). -->
      <div class="panel" data-panel="notif">
        <div class="cell" style="left:40px;top:48px;width:460px;height:88px"></div>
        <div class="cell" style="left:40px;top:152px;width:460px;height:88px"></div>
        <div class="cell shadow" style="left:40px;top:264px;width:460px;height:92px"></div>
        <div class="cell" style="left:48px;top:278px;width:444px;height:88px"></div>
        <div class="cell" style="left:113px;top:388px;width:314px;height:64px"></div>
      </div>
      <!-- Quick settings: tile grid. Same header + dock reserve. -->
      <div class="panel" data-panel="qs">
        <div class="cell" style="left:40px;top:60px;width:97px;height:97px"></div>
        <div class="cell" style="left:161px;top:60px;width:97px;height:97px"></div>
        <div class="cell" style="left:282px;top:60px;width:97px;height:97px"></div>
        <div class="cell" style="left:403px;top:60px;width:97px;height:97px"></div>
        <div class="cell" style="left:40px;top:177px;width:97px;height:97px"></div>
        <div class="cell" style="left:161px;top:177px;width:97px;height:97px"></div>
        <div class="cell" style="left:282px;top:177px;width:97px;height:97px"></div>
        <div class="cell" style="left:403px;top:177px;width:97px;height:97px"></div>
        <div class="cell" style="left:40px;top:294px;width:216px;height:97px"></div>
        <div class="cell" style="left:280px;top:294px;width:216px;height:97px"></div>
        <div class="cell" style="left:40px;top:411px;width:460px;height:42px"></div>
      </div>
    </div>
  </div>
  <!-- Solid plate behind the dock in stage-1 -->
  <div id="dock-plate"></div>

  <!-- Dock -->
  <div id="dock">
    <div id="dock-row">
      <!-- 0: Search -->
      <div class="dock-icon" data-app="search">
        <div class="tray">
          <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10.5" cy="10.5" r="6.5"/>
            <line x1="15.5" y1="15.5" x2="21" y2="21"/>
          </svg>
        </div>
      </div>
      <!-- 1: Home (release = go home); the 4-app fan is a bonus -->
      <div class="dock-icon" data-app="favourites">
        <div class="tray">
          <svg class="glyph" viewBox="0 0 256 256" fill="#fff">
            <path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"></path>
          </svg>
        </div>
      </div>
      <!-- 2: Running apps (center). Not pre-active — the .active class is
           only added once the finger actually hits an icon during the drag. -->
      <div class="dock-icon running" data-app="running">
        <div class="tray">
          <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="8" width="12" height="13" rx="2.5"/>
            <path d="M8 8V5.5A2.5 2.5 0 0 1 10.5 3H18.5A2.5 2.5 0 0 1 21 5.5V13.5A2.5 2.5 0 0 1 18.5 16H16"/>
          </svg>
        </div>
      </div>
      <!-- 3: Notifications -->
      <div class="dock-icon" data-app="notifications">
        <div class="tray">
          <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9a6 6 0 0 1 12 0c0 4.5 1.8 5.7 2 6H4c0.2-0.3 2-1.5 2-6z"/>
            <path d="M10 20a2 2 0 0 0 4 0"/>
          </svg>
        </div>
      </div>
      <!-- 4: Quick settings -->
      <div class="dock-icon" data-app="quicksettings">
        <div class="tray">
          <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3.5" y1="8" x2="20.5" y2="8"/>
            <circle cx="9" cy="8" r="2.6"/>
            <line x1="3.5" y1="16" x2="20.5" y2="16"/>
            <circle cx="15" cy="16" r="2.6"/>
          </svg>
        </div>
      </div>
    </div>
    <!-- Collapsed indicator: 5 dots replace the icon row after commit -->
    <div id="dock-dots">
      <span class="ndot" data-non-viewer></span>
      <span class="ndot" data-non-viewer></span>
      <span class="ndot on"></span>
      <span class="ndot"></span>
      <span class="ndot"></span>
    </div>
  </div>

  <!-- Search overlay: results + expanding bar + keyboard -->
  <div id="search-overlay">
    <div id="search-results">
      <div class="sr-row"><div class="sr-ico"></div><div class="sr-lines"><div class="sr-line" style="width:180px"></div><div class="sr-line" style="width:110px"></div></div></div>
      <div class="sr-row"><div class="sr-ico"></div><div class="sr-lines"><div class="sr-line" style="width:140px"></div><div class="sr-line" style="width:90px"></div></div></div>
      <div class="sr-row"><div class="sr-ico"></div><div class="sr-lines"><div class="sr-line" style="width:200px"></div><div class="sr-line" style="width:130px"></div></div></div>
    </div>
    <div id="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/>
      </svg>
      <span class="sb-text">Search apps, settings, web</span>
    </div>
    <div id="keyboard"></div>
  </div>

  <!-- Favourites fan-out (4 apps) -->
  <div id="fav-fan"></div>

  <!-- Corner toggles -->
  <div id="edge-toggle"      class="corner-toggle">Edges: OFF</div>
  <div id="favs-toggle"      class="corner-toggle">Favs: ON</div>
  <div id="dock-fill-toggle" class="corner-toggle">Dock BG: ON</div>

  <!-- Bottom edge -->
  <div id="deadzone"></div>
  <div id="swipe-zone"></div>
</div>

<script>
const frame        = document.getElementById('frame');
const swipeZone    = document.getElementById('swipe-zone');
const dock         = document.getElementById('dock');
const dockIcons    = Array.from(document.querySelectorAll('.dock-icon'));
const appScreen    = document.getElementById('app-screen');
const appStrip     = document.getElementById('app-strip');
const recentsPreview = document.getElementById('recents-preview');
const recentsTrack = document.getElementById('recents-track');
const recentsBg    = document.getElementById('recents-bg');
const favFan       = document.getElementById('fav-fan');
const panels       = document.getElementById('panels');
const panelsTrack  = document.getElementById('panels-track');
const navDots      = Array.from(document.querySelectorAll('.ndot'));
const searchOverlay = document.getElementById('search-overlay');

/* ---------- keyboard (visual only, built once) ---------- */
const KB_ROWS = [
  { top: 3,   left: 20, width: 500, keys: 'qwertyuiop'.split('').map(c => ({ c })) },
  { top: 59,  left: 45, width: 450, keys: 'asdfghjkl'.split('').map(c => ({ c })) },
  { top: 115, left: 5,  width: 528, keys: [
      { c: '⇧', cw: 90, kw: 82, bg: '#636363', fs: 24 },
      ...'zxcvbnm'.split('').map(c => ({ c })),
      { c: '⌫', cw: 88, kw: 80, bg: '#474747', fs: 22 },
  ]},
  { top: 171, left: 5,  width: 530, keys: [
      { c: '?123', cw: 72,  kw: 64,  kh: 44, fs: 18 },
      { c: ',',    cw: 50,  kw: 42,  kh: 44, fs: 22 },
      { c: '',     cw: 276, kw: 268, kh: 44, bg: '#474747' },
      { c: '.',    cw: 52,  kw: 42,  kh: 44, fs: 22 },
      { c: 'done', cw: 80,  kw: 68,  kh: 44, fs: 18, bg: '#636363' },
  ]},
];
(function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  KB_ROWS.forEach(row => {
    const r = document.createElement('div');
    r.className = 'kb-row';
    r.style.top = row.top + 'px';
    r.style.left = row.left + 'px';
    r.style.width = row.width + 'px';
    row.keys.forEach(k => {
      const cell = document.createElement('div');
      cell.className = 'kb-cell';
      if (k.cw) cell.style.width = k.cw + 'px';
      const key = document.createElement('div');
      key.className = 'kb-key';
      key.textContent = k.c;
      if (k.kw) key.style.width = k.kw + 'px';
      if (k.kh) key.style.height = k.kh + 'px';
      if (k.bg) key.style.background = k.bg;
      if (k.fs) key.style.fontSize = k.fs + 'px';
      cell.appendChild(key);
      r.appendChild(cell);
    });
    kb.appendChild(r);
  });
})();

let searchLatched = false;
function showSearch() {           // live preview during the drag
  searchOverlay.classList.add('open');
  recentsBg.classList.add('visible');
}
function hideSearch() {
  searchOverlay.classList.remove('open');
}
function commitSearch() {         // lock open on release
  searchLatched = true;
  searchOverlay.classList.add('open');
  recentsBg.classList.add('visible');
  closeFan();
}

const FRAME_H   = 620;
const DOCK_TOP  = FRAME_H - 26 - 78;   // y of the dock's top within the frame = 516
const RUNNING_INDEX = 2;               // centre slot

/* ---------- apps / recents data ---------- */
// Favourites = the 4 quick-access apps that live inside the folder
const FAVOURITES = [
  { icon: 'icons/notes-app-icon.png',    color: '#BEDE72' },
  { icon: 'icons/camera-app-icon.png',   color: '#FFBBBC' },
  { icon: 'icons/music-app-icon.png',    color: '#D4B2FF' },
  { icon: 'icons/settings-app-icon.png', color: '#9AD0EC' },
];

let recents = ['recents/1.png', 'recents/2.png', 'recents/3.png']; // [0] = most recent
let currentApp = null;  // foreground app key, null on home

function appBg(key) {
  if (typeof key === 'string' && key.endsWith('.png')) {
    return `#000 url('${key}') center / cover no-repeat`;
  }
  return key;
}

/* ---------- recents overview ---------- */
const CARD_W = 324, CARD_GAP = 44, CARD_STEP = CARD_W + CARD_GAP;
let recentsCards = [];
let recentsIndex = 0;

// Per-app icon shown in the chip at the top of each preview card.
// Demo apps (recents/*.png screenshots and the solid 'blue' app) get a
// rough icon assignment; real apps would ship their own.
const ICON_FOR = {
  'recents/1.png': 'icons/music-app-icon.png',
  'recents/2.png': 'icons/camera-app-icon.png',
  'recents/3.png': 'icons/settings-app-icon.png',
  'blue':          'icons/notes-app-icon.png',
};
function iconForApp(key) {
  const path = ICON_FOR[key];
  return path ? `url('${path}') center / cover no-repeat` : appBg(key);
}

function buildRecentsPreview(animate = false, withCurrent = false) {
  recentsTrack.innerHTML = '';
  const list = (withCurrent ? recents : recents.filter(c => c !== currentApp));
  recentsCards = list.reverse(); // rightmost = most recent
  recentsCards.forEach((key) => {
    const card = document.createElement('div');
    card.className = 'preview-card';
    card.style.background = appBg(key);
    card.style.setProperty('--app-icon', iconForApp(key));
    card.dataset.appKey = key;
    recentsTrack.appendChild(card);
  });
  recentsIndex = Math.max(0, recentsCards.length - 1);
  setRecentsOffset(offsetForIndex(recentsIndex), animate);
}
function offsetForIndex(i) {
  const N = recentsCards.length;
  return -(i - (N - 1) / 2) * CARD_STEP;
}
// Shared by the recents carousel and the app-switch strip
function setTrackTranslate(el, px, animate, ms = 280) {
  el.style.transition = animate ? `transform ${ms}ms cubic-bezier(0.22,1,0.36,1)` : 'none';
  el.style.transform = `translateX(${px}px)`;
}
function setRecentsOffset(px, animate) { setTrackTranslate(recentsTrack, px, animate); }

// Velocity helper: returns 0 if the pointer paused before sampling
const liveVel = (v, sampleT) => (performance.now() - sampleT) > 80 ? 0 : v;

// Reset the app-screen transform / classes used during minimize
function resetAppScreen() {
  appScreen.classList.remove('open', 'minimizing');
  appScreen.style.transform = '';
  appScreen.style.transformOrigin = '';
}

// Hide the panel container (unless currently latched). The only caller now
// is the staging/dock flow — nothing ever opens the panel pre-commit, so
// the matching previewViewer helper has been removed.
function closeViewerPreview() {
  if (panelsLatched) return;
  panels.classList.remove('open');
  if (!recentsLatched) recentsBg.classList.remove('visible');
}

/* ---------- favourites fan-out ---------- */
const favTiles = [];
FAVOURITES.forEach((f, i) => {
  const img = document.createElement('img');
  img.className = 'fav-tile';
  img.src = f.icon;
  img.dataset.fav = i;
  favFan.appendChild(img);
  favTiles.push(img);
});
let favSelected = -1;

function setFavSel(i) {
  if (i === favSelected) return;
  favTiles.forEach((t, k) => t.classList.toggle('sel', k === i));
  favSelected = i;
}
function closeFan() {
  favFan.classList.remove('open');
  setFavSel(-1);
}

/* ---------- notifications / quick-settings panels ---------- */
// Viewer indices: 0 = recents, 1 = notifications, 2 = quick-settings
let panelsLatched = false;
let panelIndex = 0;
// Two-stage gesture: stage-1 = arc dock revealed over running app, no commit yet.
// Stage-2 = a second drag from the dock picks a surface (recents / notif / qs / fav / search).
let dockStaged = false;

// Maps viewer index (0=recents, 1=notif, 2=qs) → dot index (2/3/4)
const VIEWER_DOT_INDEX = [2, 3, 4];
function setPanelIndex(i) {
  panelIndex = Math.max(0, Math.min(2, i));
  panelsTrack.style.transform = `translateX(${-540 * panelIndex}px)`;
  navDots.forEach((d, k) => d.classList.toggle('on', k === VIEWER_DOT_INDEX[panelIndex]));
  recentsLatched = panelsLatched && panelIndex === 0;
}
// Collapse the dock's icon row into the 5-dot indicator. We mirror the
// state onto #frame too so panel contents can shift down into the space
// freed by the shorter dock.
function collapseNav() { dock.classList.add('collapsed'); frame.classList.add('dock-collapsed'); }
function expandNav()   { dock.classList.remove('collapsed'); frame.classList.remove('dock-collapsed'); }
// Stage-1 latch: dock visible over the running app, no surface committed yet.
function stageDock() {
  dockStaged = true;
  dock.classList.add('revealed');
  expandNav();
  closeFan();
  closeViewerPreview();                          // tear down any live recents/notif/qs preview
  hideSearch();
  recentsBg.classList.add('visible', 'light');   // soft dim so dock pops over the app
}
function unstageDock() {
  if (!dockStaged) return;
  dockStaged = false;
  dock.classList.remove('revealed');
  recentsBg.classList.remove('visible', 'light');
}
function hidePanels() {
  panelsLatched = false;
  recentsLatched = false;
  panels.classList.remove('open');
  recentsBg.classList.remove('light', 'visible');
  dock.classList.remove('revealed');
  expandNav();
}
/* ---------- foreground app ---------- */
function openApp(key) {
  currentApp = key;
  recents = recents.filter(c => c !== key);
  recents.unshift(key);
  appScreen.style.background = appBg(key);
  appScreen.classList.add('open');
}

/* ---------- horizontal app-switcher (swipe along the bottom edge) ---------- */
const PANEL_STEP = 540 + 40;          // panel width + gap
let switchApps = [], switchIndex = 0;

function startSwitch() {
  switchApps = recents.slice();       // running apps, stable order for the gesture
  switchIndex = Math.max(0, switchApps.indexOf(currentApp));
  appStrip.innerHTML = '';
  switchApps.forEach(key => {
    const p = document.createElement('div');
    p.className = 'app-panel';
    p.style.background = appBg(key);
    appStrip.appendChild(p);
  });
  appStrip.classList.add('active');
  appScreen.classList.remove('open'); // strip stands in for the single app screen
  setSwitchOffset(0, false);
}
function setSwitchOffset(dx, animate) {
  setTrackTranslate(appStrip, -switchIndex * PANEL_STEP + dx, animate, 240);
}
function endSwitch(dx, v) {
  const projected = dx + v * 180;     // momentum → quick snap
  let delta = Math.round(-projected / PANEL_STEP);
  if (delta === 0 && Math.abs(dx) > PANEL_STEP * 0.16) delta = dx < 0 ? 1 : -1;
  switchIndex = Math.max(0, Math.min(switchApps.length - 1, switchIndex + delta));
  setSwitchOffset(0, true);
  const key = switchApps[switchIndex];
  setTimeout(() => {                   // after the snap, hand back to the single app screen
    currentApp = key;
    appScreen.style.background = appBg(key);
    appScreen.classList.add('open');
    appStrip.classList.remove('active');
  }, 240);
}

/* Begin minimizing the open app the instant the swipe reveals the overview.
   The app lifts above the dim + recents (z15) and zooms into its centred card
   rect (left 108, top 113, 324x372 = scale 0.6 from top-left). As it shrinks
   it reveals the dimmed HOME behind it, and when removed the identical card is
   already there underneath. currentApp is cleared so the app becomes the
   most-recent card and the rest of the drag proceeds normally. */
function startMinimize() {
  if (!currentApp) return;
  currentApp = null;                        // app becomes the most-recent card
  buildRecentsPreview();                    // app is the centred card
  recentsPreview.classList.add('no-scale'); // card pinned at its final position

  appScreen.classList.add('minimizing');    // z15 — above dim + recents
  appScreen.style.transformOrigin = 'top left';
  void appScreen.offsetWidth;               // commit the full-size start state
  appScreen.style.transform = 'translate(108px, 144px) scale(0.6)';

  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true;
    appScreen.removeEventListener('transitionend', done);
    resetAppScreen();
    recentsPreview.classList.remove('no-scale');
  };
  appScreen.addEventListener('transitionend', done);
  setTimeout(done, 340); // fallback if transitionend doesn't fire
}

/* ---------- global states (only what other handlers read) ---------- */
let gestureFrameRect = null;
let dragging = false;
let recentsLatched = false;
let activeIndex = RUNNING_INDEX;
const FLICK_VELOCITY = 1.9;   // px/ms — must be a deliberate fling, not a normal swipe-up

function activeApp() { return dockIcons[activeIndex].dataset.app; }

function setActive(index) {
  if (index === activeIndex) return;
  dockIcons[activeIndex].classList.remove('active');
  dockIcons[index].classList.add('active');
  activeIndex = index;
  updateOverview();
}

// Live preview shown for each dock slot during the drag. We deliberately
// DON'T open the notif/qs/recents panels here — opening them mid-drag makes
// the sheet visibly jump up under the finger. The dock icon highlight is
// the only feedback during the drag; the chosen panel slides in once on
// commit. Favourites (fan) and search (keyboard) are still safe to preview
// because they're not sheets that compete with the dock motion.
const SURFACE_PREVIEW = {
  running:       () => { closeFan(); closeViewerPreview(); hideSearch(); },
  favourites:    () => { closeViewerPreview(); hideSearch(); favFan.classList.add('open'); },
  notifications: () => { closeFan(); closeViewerPreview(); hideSearch(); },
  quicksettings: () => { closeFan(); closeViewerPreview(); hideSearch(); },
  search:        () => { closeFan(); closeViewerPreview(); showSearch(); },
};
function updateOverview() {
  if (!dock.classList.contains('revealed')) return;
  recentsBg.classList.add('visible'); // dim always sits over the home/app behind
  const app = activeApp();
  if (app !== 'search') hideSearch();
  (SURFACE_PREVIEW[app] || (() => {}))();
}

// Pick the active dock slot — but while the finger is up in the open
// favourites fan, stay on favourites and select a fan tile instead.
function updateActiveAndFan(px, py) {
  const aboveDock = py < (gestureFrameRect.top + DOCK_TOP - 4);
  if (activeApp() === 'favourites' && favFan.classList.contains('open') && aboveDock) {
    setFavSel(nearestFavIndex(px));
    return;
  }
  const hit = hitIconIndex(px);
  // Over a gap → no slot armed: snap back to the running centre so a release
  // here lands in stage-1 instead of accidentally committing a neighbour.
  setActive(hit === -1 ? RUNNING_INDEX : hit);
  if (activeApp() === 'favourites') {
    favFan.classList.add('open');
    setFavSel(-1);
  }
}

// Index of the element whose horizontal centre is nearest the pointer X.
// Optional perEl weight multiplier (per index) lets us bias selection.
function nearestByX(els, px, weight) {
  let best = 0, bd = Infinity;
  els.forEach((el, i) => {
    const r = el.getBoundingClientRect();
    const d = Math.abs(px - (r.left + r.width / 2)) * (weight ? weight(i) : 1);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
// Strict hit-test: returns the icon index whose inner tray contains px, else -1.
// We test the tray (the visible 64×64 chip) instead of the full slot so the
// gaps between icons select nothing.
function hitIconIndex(px) {
  for (let i = 0; i < dockIcons.length; i++) {
    const tray = dockIcons[i].querySelector('.tray');
    if (!tray) continue;
    const r = tray.getBoundingClientRect();
    if (px >= r.left && px <= r.right) return i;
  }
  return -1;
}
const nearestFavIndex  = (px) => nearestByX(favTiles, px);

/* ---------- bottom-edge gesture: swipe UP = overview, swipe L/R = app-switch ---------- */
swipeZone.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  // dismiss any open overview first
  if (recentsLatched) unlatchRecents();
  if (panelsLatched) hidePanels();
  if (searchLatched) { searchLatched = false; hideSearch(); }
  if (dockStaged)  unstageDock();                 // fresh swipe wipes any prior stage-1
  expandNav();                                    // fresh swipe re-shows the icon row

  const startX = e.clientX, startY0 = e.clientY;
  let mode = null;                 // null | 'reveal' | 'switch'
  let revealed = false;
  let revealedAt = 0;              // ms timestamp when arc dock popped
  let selectLive = false;          // true once finger past travel + dwell — slot tracking on
  let prevY = startY0, prevT = performance.now(), velocity = 0;
  let hPrevX = startX, hPrevT = prevT, hVel = 0;
  dragging = true;
  recentsLatched = false;
  gestureFrameRect = frame.getBoundingClientRect();

  dockIcons.forEach(ic => ic.classList.remove('active'));
  activeIndex = RUNNING_INDEX;   // logical default; no visual highlight until finger lands
  frame.setPointerCapture(e.pointerId);

  const onMove = (e2) => {
    if (!dragging) return;
    const adx = Math.abs(e2.clientX - startX);
    const ady = Math.abs(e2.clientY - startY0);

    if (!mode) {
      const up = startY0 - e2.clientY;            // up = the primary gesture
      if (up > 24) {
        mode = 'reveal';
        revealed = true;
        revealedAt = performance.now();
        dock.classList.add('revealed');
        // Dock just overlays whatever's behind (app or home). The app stays
        // full-size; we only minimize it if the user actually commits to
        // recents on release. Notif/qs/home/search leave the app alone.
      } else if (currentApp && recents.length >= 2 && adx > 44 && adx > ady * 3) {
        // app-switch is secondary: needs a long, near-flat sideways drag
        mode = 'switch';
        startSwitch();
      }
    }

    if (mode === 'reveal') {
      const now = performance.now(), dt = now - prevT;
      if (dt > 0) { velocity = (prevY - e2.clientY) / dt; prevT = now; prevY = e2.clientY; }
      // Selection only goes live past the reveal-travel window AND a short
      // dwell, so the user can actually see the icons land before the dock
      // starts tracking the finger to a slot.
      const up = startY0 - e2.clientY;
      if (!selectLive && up > 56 && (now - revealedAt) > 220) selectLive = true;
      if (selectLive) updateActiveAndFan(e2.clientX, e2.clientY);
    } else if (mode === 'switch') {
      const now = performance.now(), dt = now - hPrevT;
      if (dt > 0) { hVel = (e2.clientX - hPrevX) / dt; hPrevT = now; hPrevX = e2.clientX; }
      setSwitchOffset(e2.clientX - startX, false);
    }
  };

  const onUp = (e2) => {
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);
    dragging = false;

    if (mode === 'reveal') {
      if (liveVel(velocity, prevT) > FLICK_VELOCITY) { goHome(); return; }
      if (!revealed) { collapseAll(); return; }
      // Two-stage: if selection never went live (released inside the reveal
      // window, before the dwell finished, or never drifted off-centre) →
      // stage-1 latch. Past the live-window with a side-slot pick → one-shot
      // commit.
      if (!selectLive) { stageDock(); return; }
      if (activeIndex === RUNNING_INDEX) {
        // Centre release. Two cases:
        //  (a) long continuous upward swipe (> 180 px) → they're committing
        //      to recents in one motion. Minimize the foreground app (if
        //      any) into its card slot, then latch recents.
        //  (b) shorter centred release → stage-1 latch (dock parked over
        //      the app; no minimize, the app stays full-size behind).
        const upTravel = startY0 - e2.clientY;
        if (upTravel > 180) {
          if (currentApp) startMinimize();
          latchRecents();
          return;
        }
        stageDock(); return;
      }
      routeRelease();
    } else if (mode === 'switch') {
      endSwitch(e2.clientX - startX, liveVel(hVel, hPrevT));
    }
    // mode === null → a tap, nothing to do
  };

  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
});

/* Decide what the active slot does on release */
function routeRelease() {
  const app = activeApp();
  if (app === 'running') {
    // Recents was actually chosen — NOW fire the minimize (the swipe
    // reveal only overlaid the dock, the app was still full-size).
    if (currentApp) startMinimize();
    latchRecents();
  } else if (app === 'favourites') {
    if (favSelected >= 0) {
      const fav = FAVOURITES[favSelected];
      collapseAll();
      openApp(fav.color);   // bonus: launch a fanned app
    } else {
      goHome();             // releasing on the home icon → home
    }
  } else if (app === 'notifications' || app === 'quicksettings') {
    commitDrawer(app === 'quicksettings' ? 'qs' : 'notif');
  } else { // search
    dock.classList.remove('revealed'); // keyboard covers the dock in search mode
    commitSearch();
  }
}

// Snap the panels-track horizontally to the target index WITHOUT animation,
// so the subsequent #panels slide-up is purely vertical. Otherwise the
// horizontal translate animates in parallel with the vertical reveal and
// the panel reads as 'coming from the corner'.
function snapPanelIndex(i) {
  panelsTrack.style.transition = 'none';
  setPanelIndex(i);
  void panelsTrack.offsetWidth;               // flush layout
  panelsTrack.style.transition = '';
}

// The drawer is already shown live by the drag — just lock it open on release.
function commitDrawer(which) {
  panelsLatched = true;                       // lock before setPanelIndex so recentsLatched derives correctly
  snapPanelIndex(which === 'qs' ? 2 : 1);
  panels.classList.add('open');
  recentsBg.classList.add('visible');
  recentsBg.classList.remove('light');
  dock.classList.add('revealed');
  collapseNav();                              // icons fade to 5-dot indicator
  closeFan();
}

function collapseAll() {
  dockStaged = false;
  dock.classList.remove('revealed');
  expandNav();
  closeFan();
  hideSearch();
  panels.classList.remove('open');
  recentsBg.classList.remove('visible', 'light');
  panelsLatched = false;
  recentsLatched = false;
}
function latchRecents() {
  panelsLatched = true;
  snapPanelIndex(0);                           // also sets recentsLatched=true (via setPanelIndex)
  panels.classList.add('open');
  recentsBg.classList.add('visible');
  recentsBg.classList.remove('light');
  dock.classList.add('revealed');
  collapseNav();                               // icons fade to 5-dot indicator
  closeFan();
}
function unlatchRecents() {
  panelsLatched = false;
  recentsLatched = false;
  panels.classList.remove('open');
  recentsBg.classList.remove('visible', 'light');
  dock.classList.remove('revealed');
  expandNav();
}
function goHome() {
  recentsLatched = panelsLatched = searchLatched = false;
  currentApp = null;
  resetAppScreen();
  recentsPreview.classList.remove('no-scale');
  collapseAll();                       // dock + fan + drawer + search + recents
  recentsBg.classList.remove('visible', 'light');
}

/* ===================== recents carousel interactions ===================== */
const FLING_MOMENTUM_MS = 320;
const VERT_OPEN_PX = 80, VERT_CLOSE_PX = 80, MODE_LOCK_PX = 10;
let rDragging=false, rStartX=0, rStartY=0, rBaseOffset=0, rStartTarget=null, rCard=null, rMode=null;
let rPrevX=0, rPrevT=0, rVel=0;

recentsPreview.addEventListener('pointerdown', (e) => {
  if (!recentsLatched) return;
  if (!e.target.closest('.preview-card')) return;
  rDragging = true; rMode = null;
  rStartX = e.clientX; rStartY = e.clientY;
  rStartTarget = e.target; rCard = e.target.closest('.preview-card');
  rBaseOffset = offsetForIndex(recentsIndex);
  rPrevX = e.clientX; rPrevT = performance.now(); rVel = 0;
  recentsPreview.setPointerCapture(e.pointerId);
});
recentsPreview.addEventListener('pointermove', (e) => {
  if (!rDragging) return;
  const dx = e.clientX - rStartX, dy = e.clientY - rStartY;
  if (!rMode && (Math.abs(dx) > MODE_LOCK_PX || Math.abs(dy) > MODE_LOCK_PX)) {
    rMode = (Math.abs(dy) > Math.abs(dx) && rCard) ? 'vert' : 'horiz';
  }
  if (rMode === 'horiz') {
    const now = performance.now(), dt = now - rPrevT;
    if (dt > 0) { rVel = (e.clientX - rPrevX) / dt; rPrevT = now; rPrevX = e.clientX; }
    setRecentsOffset(rBaseOffset + dx, false);
  } else if (rMode === 'vert' && rCard) {
    rCard.style.transform = `translateY(${dy}px)`;
    rCard.style.opacity = String(Math.max(0.4, 1 - Math.abs(dy) / 400));
  }
});
recentsPreview.addEventListener('pointerup', (e) => {
  if (!rDragging) return;
  rDragging = false;
  const dx = e.clientX - rStartX, dy = e.clientY - rStartY;
  if (!rMode) {
    const card = rStartTarget && rStartTarget.closest('.preview-card');
    if (card) { unlatchRecents(); openApp(card.dataset.appKey); }
    return;
  }
  if (rMode === 'horiz') {
    const projected = dx + liveVel(rVel, rPrevT) * FLING_MOMENTUM_MS;
    let delta = Math.round(-projected / CARD_STEP);
    if (delta === 0 && Math.abs(dx) > CARD_STEP * 0.22) delta = dx < 0 ? 1 : -1;
    recentsIndex = Math.max(0, Math.min(recentsCards.length - 1, recentsIndex + delta));
    setRecentsOffset(offsetForIndex(recentsIndex), true);
    return;
  }
  if (!rCard) return;
  const key = rCard.dataset.appKey;
  if (dy > VERT_OPEN_PX) {
    rCard.style.transform = ''; rCard.style.opacity = '';
    unlatchRecents(); openApp(key);
  } else if (dy < -VERT_CLOSE_PX) {
    rCard.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
    rCard.style.transform = 'translateY(-460px)'; rCard.style.opacity = '0';
    setTimeout(() => {
      recents = recents.filter(c => c !== key);
      if (key === currentApp) currentApp = null;
      buildRecentsPreview(true);
    }, 220);
  } else {
    rCard.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
    rCard.style.transform = ''; rCard.style.opacity = '';
    setTimeout(() => { if (rCard) rCard.style.transition = ''; }, 180);
  }
});

/* ===================== panels: swipe between notif/qs, swipe down to dismiss ===================== */
let pDragging=false, pStartX=0, pStartY=0, pBase=0, pMode=null;
const PANEL_DISMISS_PX = 90;
panels.addEventListener('pointerdown', (e) => {
  if (!panelsLatched) return;
  if (e.target.closest('.preview-card')) return;  // recents card handles its own gestures
  pDragging = true; pMode = null;
  pStartX = e.clientX; pStartY = e.clientY; pBase = -540 * panelIndex;
  panels.setPointerCapture(e.pointerId);
});
panels.addEventListener('pointermove', (e) => {
  if (!pDragging) return;
  const dx = e.clientX - pStartX, dy = e.clientY - pStartY;
  if (!pMode && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
    pMode = Math.abs(dy) > Math.abs(dx) ? 'vert' : 'horiz';
  }
  if (pMode === 'horiz') {
    panelsTrack.style.transition = 'none';
    panelsTrack.style.transform = `translateX(${pBase + dx}px)`;
  } else if (pMode === 'vert' && dy > 0) {
    panels.style.transition = 'none';
    panels.style.transform = `translateY(${dy}px)`;
  }
});
panels.addEventListener('pointerup', (e) => {
  if (!pDragging) return;
  pDragging = false;
  const dx = e.clientX - pStartX, dy = e.clientY - pStartY;
  if (pMode === 'vert') {
    panels.style.transition = '';                 // restore smooth slide
    const dismiss = dy > PANEL_DISMISS_PX;
    requestAnimationFrame(() => {
      panels.style.transform = '';                // hand back to the class transform
      if (dismiss) hidePanels();
    });
    return;
  }
  panelsTrack.style.transition = '';
  // ±1 swipe across viewers (option A: recents↔notif↔qs); clamp via setPanelIndex
  let delta = 0;
  if (dx < -60) delta = 1; else if (dx > 60) delta = -1;
  setPanelIndex(panelIndex + delta);
});

/* ===================== dock taps while an overview is latched ===================== */
dock.addEventListener('pointerdown', (e) => {
  if (!recentsLatched && !panelsLatched && !dockStaged) return;
  e.stopPropagation();
  gestureFrameRect = frame.getBoundingClientRect();
  const wasCollapsed = dock.classList.contains('collapsed');
  const wasPanelsLatched = panelsLatched;
  const wasRecentsLatched = recentsLatched;
  const wasStaged = dockStaged;
  const wasIndex = panelIndex;
  expandNav();                                  // tap-while-collapsed → icons reappear
  // Re-selecting: drop the committed state so the drag can preview other
  // slots live, but keep whatever's currently shown until the finger moves.
  recentsLatched = false;
  panelsLatched = false;
  dockStaged = false;
  { const h = hitIconIndex(e.clientX); setActive(h === -1 ? RUNNING_INDEX : h); }
  frame.setPointerCapture(e.pointerId);
  const downX = e.clientX, downY = e.clientY;
  let moved = false;

  const onMove = (ev) => {
    if (!moved && Math.hypot(ev.clientX - downX, ev.clientY - downY) > 6) moved = true;
    updateActiveAndFan(ev.clientX, ev.clientY);
  };
  const onUp = () => {
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);
    if (!moved && wasCollapsed) {
      // Pure tap on the collapsed dock → just stay expanded; restore prior state
      panelsLatched = wasPanelsLatched;
      recentsLatched = wasRecentsLatched;
      setPanelIndex(wasIndex);
      return;
    }
    if (!moved && wasStaged) {
      // Pure tap while stage-1 (dockStaged): commit the icon under the
      // finger — pointerdown already set activeIndex via the tray hit-test.
      // If they tapped a gap between icons (snapped back to centre), this
      // commits recents; otherwise it commits whichever surface they tapped.
      routeRelease();
      return;
    }
    routeRelease();
  };
  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
});

/* ===================== tap-out dismiss ===================== */
frame.addEventListener('pointerdown', (e) => {
  if (dragging) return;
  if (!recentsLatched && !panelsLatched && !dockStaged) return;
  if (e.target.closest('.preview-card')) return;
  if (e.target.closest('#dock')) return;
  if (e.target.closest('#panels')) return;
  if (e.target.closest('#deadzone')) return;
  if (e.target.closest('#swipe-zone')) return;
  if (recentsLatched) unlatchRecents();
  if (panelsLatched) hidePanels();
  if (dockStaged)   unstageDock();
});

/* ===================== search: swipe down to dismiss ===================== */
let sDragging = false, sStartY = 0;
searchOverlay.addEventListener('pointerdown', (e) => {
  if (!searchLatched) return;
  sDragging = true;
  sStartY = e.clientY;
  searchOverlay.setPointerCapture(e.pointerId);
});
searchOverlay.addEventListener('pointermove', (e) => {
  if (!sDragging) return;
  const dy = e.clientY - sStartY;
  if (dy > 0) {
    searchOverlay.style.transition = 'none';
    searchOverlay.style.transform = `translateY(${dy}px)`;
  }
});
searchOverlay.addEventListener('pointerup', (e) => {
  if (!sDragging) return;
  sDragging = false;
  const dy = e.clientY - sStartY;
  searchOverlay.style.transition = '';
  searchOverlay.style.transform = '';
  if (dy > 90) { searchLatched = false; hideSearch(); recentsBg.classList.remove('visible'); }
});

/* ===================== corner toggles ===================== */
function wireToggle(id, cls, labelOn, labelOff, startOn) {
  const el = document.getElementById(id);
  if (startOn) frame.classList.add(cls);
  el.textContent = startOn ? labelOn : labelOff;
  el.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    const on = frame.classList.toggle(cls);
    el.textContent = on ? labelOn : labelOff;
  });
}
wireToggle('dock-fill-toggle', 'dock-bare',  'Dock BG: OFF', 'Dock BG: ON',  true);
wireToggle('edge-toggle',      'show-edges', 'Edges: ON',    'Edges: OFF',   false);
wireToggle('favs-toggle',      'no-favs',    'Favs: OFF',    'Favs: ON',     false);

buildRecentsPreview();
</script>
