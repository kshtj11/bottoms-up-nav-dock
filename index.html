<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=540, user-scalable=no">
<title>Nav Dock — Launcher Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #1a1a1a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    font-family: 'Inter', system-ui, sans-serif;
  }

  #frame {
    position: relative;
    width: 540px;
    height: 620px;
    overflow: hidden;
    background: #373737;
    background: color(display-p3 0.216 0.216 0.216);
  }

  /* Home screen — always the bottom layer */
  #home-screen {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #000 url('home.png') center / cover no-repeat;
  }

  /* Dim layer over the home/app behind overview surfaces */
  #recents-bg {
    position: absolute;
    inset: 0;
    z-index: 8;
    background: #000000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #recents-bg.visible {
    opacity: 0.75;
    pointer-events: auto;
  }

  /* Full-screen opened app */
  #app-screen {
    position: absolute;
    inset: 0;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #app-screen.open {
    opacity: 1;
    pointer-events: auto;
  }
  /* During minimize the app lifts above the overview and zooms into its card */
  #app-screen.minimizing {
    z-index: 15;
    transition: transform 0.34s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
  }

  /* Recent apps overview */
  #recents-preview {
    position: absolute;
    top: 113px;
    left: 0;
    width: 540px;
    height: 372px;
    z-index: 10;
    display: flex;
    justify-content: center;
    overflow: visible;
    opacity: 0;
    transform: translateY(26px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.22,1,0.36,1);
  }
  #recents-preview.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  /* slide up & out of the way when a drawer / fan takes over */
  #recents-preview.exit-up {
    opacity: 0;
    transform: translateY(-120px);
    pointer-events: none;
  }
  /* during minimize: hold at final position, fade opacity only */
  #recents-preview.no-scale,
  #recents-preview.no-scale.visible {
    transform: translateY(0);
    transition: opacity 0.3s ease;
  }
  #recents-track {
    display: flex;
    gap: 44px;
    align-items: center;
    will-change: transform;
  }
  .preview-card {
    width: 324px;
    height: 372px;
    border-radius: 4px;
    flex: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }

  /* ============ Notifications / Quick-settings bottom drawers ============ */
  #panels {
    position: absolute;
    inset: 0;                /* full-frame drawer */
    z-index: 11;
    overflow: hidden;
    transform: translateY(100%);
    pointer-events: none;
    transition: transform 0.24s cubic-bezier(0.22,1,0.36,1);
  }
  #panels.open {
    transform: translateY(0);
    pointer-events: auto;
  }
  #panels-track {
    display: flex;
    width: 1080px;
    height: 100%;
    will-change: transform;
    transition: transform 0.28s cubic-bezier(0.22,1,0.36,1);
  }
  .panel {
    position: relative;
    width: 540px;
    height: 620px;
    flex: none;
    /* transparent — only the inner cells show, over the dimmed home */
  }
  /* drawer cells (quick-settings tiles & notification cards) */
  .cell {
    position: absolute;
    background: #2D2D2D;
    background: color(display-p3 0.176 0.176 0.176);
    border-radius: 16px;
  }
  .cell.shadow {
    box-shadow: 0 4px 4px rgba(0,0,0,0.25);
    box-shadow: 0 4px 4px color(display-p3 0 0 0 / 0.25);
  }
  /* page dots — float just above the dock */
  #panel-dots {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 104px;
    display: flex;
    gap: 7px;
    z-index: 22;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  #panels.open ~ #panel-dots { opacity: 1; }
  .pdot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); }
  .pdot.on { background: #fff; }

  /* ===================== Dock ===================== */
  #dock {
    position: absolute;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(140px);
    width: 464px;
    height: 73px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
    background: rgba(217, 217, 217, 0.2);
    background: color(display-p3 0.851 0.851 0.851 / 0.2);
    border-radius: 40px;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
    transition: transform 0.28s cubic-bezier(0.22,1,0.36,1), opacity 0.2s ease;
  }
  #dock.revealed {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  #dock-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 0;
    width: 464px;
    height: 73px;
  }

  /* Each dock slot has a wide touch area with a 64px icon tray centred */
  .dock-icon {
    width: 100px;
    height: 73px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .dock-icon.running { width: 64px; }

  .tray {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(32,32,32,0.35);
    background: color(display-p3 0.125 0.125 0.125 / 0.35);
    transition: transform 0.18s cubic-bezier(0.22,1,0.36,1);
    pointer-events: none;
  }
  .dock-icon.active .tray { transform: scale(1.18); }

  .glyph {
    width: 34px;
    height: 34px;
    display: block;
  }

  /* ===================== Favourites fan-out ===================== */
  #fav-fan {
    position: absolute;
    left: 30px;
    bottom: 109px;        /* directly above the dock */
    width: 316px;
    height: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 21;
    opacity: 0;
    transform: translateY(16px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.22,1,0.36,1);
  }
  #fav-fan.open {
    opacity: 1;
    transform: translateY(0);
  }
  .fav-tile {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    object-fit: cover;
    background: #222;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    transition: transform 0.16s cubic-bezier(0.22,1,0.36,1);
  }
  .fav-tile.sel { transform: scale(1.28) translateY(-6px); }

  /* ===================== Bottom edge / swipe zone ===================== */
  #deadzone {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 16px;
    background: #111111;
    background: color(display-p3 0.067 0.067 0.067);
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 30;
  }
  #swipe-zone {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 16px;
    background: #808080;
    background: color(display-p3 0.5 0.5 0.5);
    border-radius: 8px 8px 0 0;
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 31;
    cursor: grab;
  }

  /* Corner toggle pills */
  .corner-toggle {
    position: absolute;
    top: 8px;
    z-index: 40;
    padding: 4px 8px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: #fff;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
  }
  #dock-fill-toggle { right: 8px; }
  #edge-toggle      { left: 8px; }

  #frame.dock-bare #dock { background: transparent; }
  #frame.show-edges #deadzone,
  #frame.show-edges #swipe-zone { opacity: 0.10; }
</style>
</head>
<body>

<div id="frame">
  <!-- Home screen -->
  <div id="home-screen"></div>

  <!-- Opened app -->
  <div id="app-screen"></div>

  <!-- Dim layer -->
  <div id="recents-bg"></div>

  <!-- Recent apps overview -->
  <div id="recents-preview">
    <div id="recents-track"></div>
  </div>

  <!-- Notifications / Quick-settings bottom drawers -->
  <div id="panels">
    <div id="panels-track">
      <!-- Notifications: stacked cards -->
      <div class="panel" data-panel="notif">
        <div class="cell" style="left:113px;top:458px;width:314px;height:67px"></div>
        <div class="cell" style="left:48px;top:346px;width:444px;height:93px"></div>
        <div class="cell shadow" style="left:40px;top:331px;width:460px;height:97px"></div>
        <div class="cell" style="left:40px;top:211px;width:460px;height:97px"></div>
        <div class="cell" style="left:40px;top:91px;width:460px;height:97px"></div>
      </div>
      <!-- Quick settings: tile grid -->
      <div class="panel" data-panel="qs">
        <div class="cell" style="left:40px;top:176px;width:97px;height:97px"></div>
        <div class="cell" style="left:161px;top:176px;width:97px;height:97px"></div>
        <div class="cell" style="left:282px;top:176px;width:97px;height:97px"></div>
        <div class="cell" style="left:403px;top:176px;width:97px;height:97px"></div>
        <div class="cell" style="left:40px;top:295px;width:97px;height:97px"></div>
        <div class="cell" style="left:161px;top:295px;width:97px;height:97px"></div>
        <div class="cell" style="left:282px;top:295px;width:97px;height:97px"></div>
        <div class="cell" style="left:403px;top:295px;width:97px;height:97px"></div>
        <div class="cell" style="left:40px;top:423px;width:216px;height:97px"></div>
        <div class="cell" style="left:280px;top:423px;width:216px;height:97px"></div>
      </div>
    </div>
  </div>
  <div id="panel-dots">
    <div class="pdot on"></div>

  <!-- Dock -->
  <div id="dock">
    <div id="dock-row">
      <!-- 0: Search -->
      <div class="dock-icon" data-app="search">
        <div class="tray">
          <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10.5" cy="10.5" r="6.5"/>

      <!-- 1: Favourites folder -->
      <div class="dock-icon" data-app="favourites">
        <div class="tray">
          <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="3.5" width="7" height="7" rx="2"/>
            <rect x="13.5" y="3.5" width="7" height="7" rx="2"/>
            <rect x="3.5" y="13.5" width="7" height="7" rx="2"/>
            <rect x="13.5" y="13.5" width="7" height="7" rx="2"/>
          </svg>

      </div>
      <!-- 2: Running apps (center, default active) -->
      <div class="dock-icon running active" data-app="running">
        <div class="tray">
          <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="8" width="12" height="13" rx="2.5"/>
            <path d="M8 8V5.5A2.5 2.5 0 0 1 10.5 3H18.5A2.5 2.5 0 0 1 21 5.5V13.5A2.5 2.5 0 0 1 18.5 16H16"/>
          </svg>

      <!-- 3: Notifications -->
      <div class="dock-icon" data-app="notifications">
        <div class="tray">
          <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9a6 6 0 0 1 12 0c0 4.5 1.8 5.7 2 6H4c0.2-0.3 2-1.5 2-6z"/>

      <div class="dock-icon" data-app="quicksettings">
        <div class="tray">
          <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3.5" y1="8" x2="20.5" y2="8"/>
            <circle cx="9" cy="8" r="2.6"/>
            <line x1="3.5" y1="16" x2="20.5" y2="16"/>
            <circle cx="15" cy="16" r="2.6"/>

  </div>

  <!-- Favourites fan-out (4 apps) -->
  <div id="fav-fan"></div>

  <!-- Corner toggles -->
  <div id="edge-toggle"      class="corner-toggle">Edges: OFF</div>
  <div id="dock-fill-toggle" class="corner-toggle">Dock BG: ON</div>

  <!-- Bottom edge -->
  <div id="deadzone"></div>
  <div id="swipe-zone"></div>

<script>
const frame        = document.getElementById('frame');
const swipeZone    = document.getElementById('swipe-zone');
const dock         = document.getElementById('dock');
const dockIcons    = Array.from(document.querySelectorAll('.dock-icon'));
const appScreen    = document.getElementById('app-screen');
const recentsPreview = document.getElementById('recents-preview');
const recentsTrack = document.getElementById('recents-track');
const recentsBg    = document.getElementById('recents-bg');
const favFan       = document.getElementById('fav-fan');
const panels       = document.getElementById('panels');
const panelsTrack  = document.getElementById('panels-track');
const panelDots    = Array.from(document.querySelectorAll('.pdot'));

const FRAME_H   = 620;
const DOCK_TOP  = FRAME_H - 26 - 73;   // y of the dock's top within the frame = 521
const RUNNING_INDEX = 2;               // centre slot

/* ---------- apps / recents data ---------- */
// Favourites = the 4 quick-access apps that live inside the folder
const FAVOURITES = [
  { icon: 'icons/notes-app-icon.png',    color: '#BEDE72' },
  { icon: 'icons/camera-app-icon.png',   color: '#FFBBBC' },
  { icon: 'icons/music-app-icon.png',    color: '#D4B2FF' },
  { icon: 'icons/settings-app-icon.png', color: '#9AD0EC' },
];

let recents = ['recents/1.png', 'recents/2.png', 'recents/3.png']; // [0] = most recent
let currentApp = null;  // foreground app key, null on home

function appBg(key) {
  if (typeof key === 'string' && key.endsWith('.png')) {
    return `#000 url('${key}') center / cover no-repeat`;
  }
  return key;
}

/* ---------- recents overview ---------- */
const CARD_W = 324, CARD_GAP = 44, CARD_STEP = CARD_W + CARD_GAP;
let recentsCards = [];
let recentsIndex = 0;

function buildRecentsPreview(animate = false) {
  recentsTrack.innerHTML = '';
  recentsCards = recents.filter(c => c !== currentApp).reverse(); // rightmost = most recent
  recentsCards.forEach((key) => {
    const card = document.createElement('div');
    card.className = 'preview-card';
    card.style.background = appBg(key);
    card.dataset.appKey = key;
    recentsTrack.appendChild(card);
  });
  recentsIndex = Math.max(0, recentsCards.length - 1);
  setRecentsOffset(offsetForIndex(recentsIndex), animate);
}
function offsetForIndex(i) {
  const N = recentsCards.length;
  return -(i - (N - 1) / 2) * CARD_STEP;
}
function setRecentsOffset(px, animate) {
  recentsTrack.style.transition = animate
    ? 'transform 0.28s cubic-bezier(0.22,1,0.36,1)' : 'none';
  recentsTrack.style.transform = `translateX(${px}px)`;
}

function showRecentsView() {
  recentsPreview.classList.remove('exit-up');
  recentsPreview.classList.add('visible');
  recentsBg.classList.add('visible');
}
function hideRecentsView() {
  recentsPreview.classList.remove('visible', 'exit-up');
  if (!panelsLatched) recentsBg.classList.remove('visible');
}
// Live during the drag: recents in place ('in') or sliding up & out ('up')
function slideRecents(state) {
  if (state === 'in') {
    recentsPreview.classList.remove('exit-up');
    recentsPreview.classList.add('visible');
    recentsBg.classList.add('visible');
  } else {
    recentsPreview.classList.remove('visible');
    recentsPreview.classList.add('exit-up');
  }
}
// Live drawer preview — slides up from behind the dock
function showDrawer(which) {
  setPanelIndex(which === 'qs' ? 1 : 0);
  panels.classList.add('open');
  recentsBg.classList.add('visible');
}
function hideDrawer() {
  if (panelsLatched) return;
  panels.classList.remove('open');
}

/* ---------- favourites fan-out ---------- */
const favTiles = [];
FAVOURITES.forEach((f, i) => {
  const img = document.createElement('img');
  img.className = 'fav-tile';
  img.src = f.icon;
  img.dataset.fav = i;
  favFan.appendChild(img);
  favTiles.push(img);
});
let favSelected = -1;

function setFavSel(i) {
  if (i === favSelected) return;
  favTiles.forEach((t, k) => t.classList.toggle('sel', k === i));
  favSelected = i;
}
function closeFan() {
  favFan.classList.remove('open');
  setFavSel(-1);
}

/* ---------- notifications / quick-settings panels ---------- */
let panelsLatched = false;
let panelIndex = 0; // 0 = notifications, 1 = quick settings

function setPanelIndex(i) {
  panelIndex = Math.max(0, Math.min(1, i));
  panelsTrack.style.transform = `translateX(${-540 * panelIndex}px)`;
  panelDots.forEach((d, k) => d.classList.toggle('on', k === panelIndex));
}
function hidePanels() {
  panelsLatched = false;
  panels.classList.remove('open');
  if (!recentsLatched) recentsBg.classList.remove('visible');
}

/* ---------- foreground app ---------- */
function openApp(key) {
  currentApp = key;
  recents = recents.filter(c => c !== key);
  recents.unshift(key);
  appScreen.style.background = appBg(key);
  appScreen.classList.add('open');
}

/* Minimize the open app: zoom it down onto its recents card (scroll-up in app).
   The app lifts above the overview and scales to the exact centred-card rect
   (left 108, top 113, 324x372 = scale 0.6 from the top-left), so when it's
   removed the identical card is revealed underneath with no jump. */
function minimizeAppIntoRecents() {
  recentsLatched = true;
  dock.classList.add('revealed');
  currentApp = null;                       // the app becomes the centred card
  buildRecentsPreview();
  recentsPreview.classList.add('no-scale'); // cards at final scale, fade opacity only
  showRecentsView();

  appScreen.classList.add('minimizing');    // z-index above overview + transform transition
  appScreen.style.transformOrigin = 'top left';
  void appScreen.offsetWidth;               // commit the full-size start state
  appScreen.style.transform = 'translate(108px, 113px) scale(0.6)';

  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true;
    appScreen.removeEventListener('transitionend', done);
    appScreen.classList.remove('open', 'minimizing');
    appScreen.style.transform = '';
    appScreen.style.transformOrigin = '';
    recentsPreview.classList.remove('no-scale');
  };
  appScreen.addEventListener('transitionend', done);
  setTimeout(done, 420); // fallback if transitionend doesn't fire
}

/* ---------- global states ---------- */
let gestureFrameRect = null;
let dragging = false;
let revealed = false;
let recentsLatched = false;
let activeIndex = RUNNING_INDEX;
let startY = 0;
let prevY = 0, prevT = 0, velocity = 0;
const FLICK_VELOCITY = 0.9;

function activeApp() { return dockIcons[activeIndex].dataset.app; }

function setActive(index) {
  if (index === activeIndex) return;
  dockIcons[activeIndex].classList.remove('active');
  dockIcons[index].classList.add('active');
  activeIndex = index;
  updateOverview();
}

// Show the right surface live for the active slot during the drag:
//   running        → recents slide into place
//   favourites     → recents slide up, fan opens
//   notifications  → recents slide up, notif drawer slides up from behind dock
//   quicksettings  → recents slide up, qs drawer slides up
//   search         → recents slide up, nothing else
function updateOverview() {
  if (!dock.classList.contains('revealed')) return;
  const app = activeApp();
  if (app === 'running') {
    hideDrawer(); closeFan(); slideRecents('in');
  } else if (app === 'favourites') {
    hideDrawer(); slideRecents('up'); favFan.classList.add('open');
  } else if (app === 'notifications') {
    closeFan(); slideRecents('up'); showDrawer('notif');
  } else if (app === 'quicksettings') {
    closeFan(); slideRecents('up'); showDrawer('qs');
  } else {
    closeFan(); hideDrawer(); slideRecents('up');
  }
}

// Pick the active dock slot — but while the finger is up in the open
// favourites fan, stay on favourites and select a fan tile instead.
function updateActiveAndFan(px, py) {
  const aboveDock = py < (gestureFrameRect.top + DOCK_TOP - 4);
  if (activeApp() === 'favourites' && favFan.classList.contains('open') && aboveDock) {
    setFavSel(nearestFavIndex(px));
    return;
  }
  setActive(nearestIconIndex(px));
  if (activeApp() === 'favourites') {
    favFan.classList.add('open');
    setFavSel(-1);
  }
}

function nearestIconIndex(px) {
  let best = 0, bd = Infinity;
  dockIcons.forEach((icon, i) => {
    const r = icon.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const d = Math.abs(px - cx);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
function nearestFavIndex(px) {
  let best = 0, bd = Infinity;
  favTiles.forEach((t, i) => {
    const r = t.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const d = Math.abs(px - cx);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}

/* ---------- primary swipe-up gesture ---------- */
swipeZone.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  // dismiss any open overview first
  if (recentsLatched) unlatchRecents();
  if (panelsLatched) hidePanels();

  dragging = true;
  revealed = false;
  recentsLatched = false;
  startY = e.clientY;
  prevY = e.clientY;
  prevT = performance.now();
  velocity = 0;
  gestureFrameRect = frame.getBoundingClientRect();

  dockIcons.forEach(ic => ic.classList.remove('active'));
  activeIndex = RUNNING_INDEX;
  dockIcons[RUNNING_INDEX].classList.add('active');

  buildRecentsPreview();
  frame.setPointerCapture(e.pointerId);

  const onMove = (e2) => {
    if (!dragging) return;
    const now = performance.now();
    const dt = now - prevT;
    if (dt > 0) { velocity = (prevY - e2.clientY) / dt; prevT = now; prevY = e2.clientY; }

    const dy = startY - e2.clientY;
    if (dy > 8 && !revealed) {
      revealed = true;
      dock.classList.add('revealed');
      updateOverview();           // show the surface for the current (centre) slot
    }
    if (!revealed) return;
    updateActiveAndFan(e2.clientX, e2.clientY);
  };

  const onUp = () => {
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);
    dragging = false;

    // Quick flick → home
    const sinceLast = performance.now() - prevT;
    const flickVel = sinceLast > 80 ? 0 : velocity;
    if (flickVel > FLICK_VELOCITY) { goHome(); return; }

    if (!revealed) { collapseAll(); return; }

    routeRelease();
  };

  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
});

/* Decide what the active slot does on release */
function routeRelease() {
  const app = activeApp();
  if (app === 'running') {
    if (currentApp) minimizeAppIntoRecents(); else latchRecents();
  } else if (app === 'favourites') {
    if (favSelected >= 0) {
      const fav = FAVOURITES[favSelected];
      collapseAll();
      openApp(fav.color);
    } else {
      collapseAll();
    }
  } else if (app === 'notifications' || app === 'quicksettings') {
    commitDrawer(app === 'quicksettings' ? 'qs' : 'notif');
  } else {
    collapseAll(); // search = stub for now
  }
}

// The drawer is already shown live by the drag — just lock it open on release.
function commitDrawer(which) {
  panelsLatched = true;
  recentsLatched = false;
  setPanelIndex(which === 'qs' ? 1 : 0);
  panels.classList.add('open');
  recentsBg.classList.add('visible');
  dock.classList.add('revealed');
  closeFan();
  recentsPreview.classList.remove('visible'); // recents stays slid up
}

function collapseAll() {
  dock.classList.remove('revealed');
  closeFan();
  hideDrawer();
  hideRecentsView();
}
function latchRecents() {
  recentsLatched = true;
  panelsLatched = false;
  panels.classList.remove('open');
  dock.classList.add('revealed');
  showRecentsView();
  closeFan();
}
function unlatchRecents() {
  recentsLatched = false;
  hideRecentsView();
  dock.classList.remove('revealed');
}
function goHome() {
  recentsLatched = false;
  panelsLatched = false;
  currentApp = null;
  appScreen.classList.remove('open');
  panels.classList.remove('open');
  hideRecentsView();
  recentsBg.classList.remove('visible');
  dock.classList.remove('revealed');
  closeFan();
}

/* ===================== recents carousel interactions ===================== */
const FLING_MOMENTUM_MS = 320;
const VERT_OPEN_PX = 80, VERT_CLOSE_PX = 80, MODE_LOCK_PX = 10;
let rDragging=false, rStartX=0, rStartY=0, rBaseOffset=0, rStartTarget=null, rCard=null, rMode=null;
let rPrevX=0, rPrevT=0, rVel=0;

recentsPreview.addEventListener('pointerdown', (e) => {
  if (!recentsLatched) return;
  if (!e.target.closest('.preview-card')) return;
  rDragging = true; rMode = null;
  rStartX = e.clientX; rStartY = e.clientY;
  rStartTarget = e.target; rCard = e.target.closest('.preview-card');
  rBaseOffset = offsetForIndex(recentsIndex);
  rPrevX = e.clientX; rPrevT = performance.now(); rVel = 0;
  recentsPreview.setPointerCapture(e.pointerId);
});
recentsPreview.addEventListener('pointermove', (e) => {
  if (!rDragging) return;
  const dx = e.clientX - rStartX, dy = e.clientY - rStartY;
  if (!rMode && (Math.abs(dx) > MODE_LOCK_PX || Math.abs(dy) > MODE_LOCK_PX)) {
    rMode = (Math.abs(dy) > Math.abs(dx) && rCard) ? 'vert' : 'horiz';
  }
  if (rMode === 'horiz') {
    const now = performance.now(), dt = now - rPrevT;
    if (dt > 0) { rVel = (e.clientX - rPrevX) / dt; rPrevT = now; rPrevX = e.clientX; }
    setRecentsOffset(rBaseOffset + dx, false);
  } else if (rMode === 'vert' && rCard) {
    rCard.style.transform = `translateY(${dy}px)`;
    rCard.style.opacity = String(Math.max(0.4, 1 - Math.abs(dy) / 400));
  }
});
recentsPreview.addEventListener('pointerup', (e) => {
  if (!rDragging) return;
  rDragging = false;
  const dx = e.clientX - rStartX, dy = e.clientY - rStartY;
  if (!rMode) {
    const card = rStartTarget && rStartTarget.closest('.preview-card');
    if (card) { unlatchRecents(); openApp(card.dataset.appKey); }
    return;
  }
  if (rMode === 'horiz') {
    const sinceLast = performance.now() - rPrevT;
    const v = sinceLast > 80 ? 0 : rVel;
    const projected = dx + v * FLING_MOMENTUM_MS;
    let delta = Math.round(-projected / CARD_STEP);
    if (delta === 0 && Math.abs(dx) > CARD_STEP * 0.22) delta = dx < 0 ? 1 : -1;
    recentsIndex = Math.max(0, Math.min(recentsCards.length - 1, recentsIndex + delta));
    setRecentsOffset(offsetForIndex(recentsIndex), true);
    return;
  }
  if (!rCard) return;
  const key = rCard.dataset.appKey;
  if (dy > VERT_OPEN_PX) {
    rCard.style.transform = ''; rCard.style.opacity = '';
    unlatchRecents(); openApp(key);
  } else if (dy < -VERT_CLOSE_PX) {
    rCard.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
    rCard.style.transform = 'translateY(-460px)'; rCard.style.opacity = '0';
    setTimeout(() => {
      recents = recents.filter(c => c !== key);
      if (key === currentApp) currentApp = null;
      buildRecentsPreview(true);
    }, 220);
  } else {
    rCard.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
    rCard.style.transform = ''; rCard.style.opacity = '';
    setTimeout(() => { if (rCard) rCard.style.transition = ''; }, 180);
  }
});

/* ===================== panels: swipe between notif/qs, swipe down to dismiss ===================== */
let pDragging=false, pStartX=0, pStartY=0, pBase=0, pMode=null;
const PANEL_DISMISS_PX = 90;
panels.addEventListener('pointerdown', (e) => {
  if (!panelsLatched) return;
  pDragging = true; pMode = null;
  pStartX = e.clientX; pStartY = e.clientY; pBase = -540 * panelIndex;
  panels.setPointerCapture(e.pointerId);
});
panels.addEventListener('pointermove', (e) => {
  if (!pDragging) return;
  const dx = e.clientX - pStartX, dy = e.clientY - pStartY;
  if (!pMode && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
    pMode = Math.abs(dy) > Math.abs(dx) ? 'vert' : 'horiz';
  }
  if (pMode === 'horiz') {
    panelsTrack.style.transition = 'none';
    panelsTrack.style.transform = `translateX(${pBase + dx}px)`;
  } else if (pMode === 'vert' && dy > 0) {
    panels.style.transition = 'none';
    panels.style.transform = `translateY(${dy}px)`;
  }
});
panels.addEventListener('pointerup', (e) => {
  if (!pDragging) return;
  pDragging = false;
  const dx = e.clientX - pStartX, dy = e.clientY - pStartY;
  if (pMode === 'vert') {
    panels.style.transition = '';                 // restore smooth slide
    const dismiss = dy > PANEL_DISMISS_PX;
    requestAnimationFrame(() => {
      panels.style.transform = '';                // hand back to the class transform
      if (dismiss) hidePanels();
    });
    return;
  }
  panelsTrack.style.transition = '';
  let idx = panelIndex;
  if (dx < -60) idx = 1; else if (dx > 60) idx = 0;
  setPanelIndex(idx);
});

/* ===================== dock taps while an overview is latched ===================== */
dock.addEventListener('pointerdown', (e) => {
  if (!recentsLatched && !panelsLatched) return;
  e.stopPropagation();
  gestureFrameRect = frame.getBoundingClientRect();
  // Re-selecting: drop the committed state so the drag can preview other
  // slots live, but keep whatever's currently shown until the finger moves.
  recentsLatched = false;
  panelsLatched = false;
  setActive(nearestIconIndex(e.clientX));
  frame.setPointerCapture(e.pointerId);

  const onMove = (ev) => updateActiveAndFan(ev.clientX, ev.clientY);
  const onUp = () => {
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);
    routeRelease();
  };
  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
});

/* ===================== tap-out dismiss ===================== */
frame.addEventListener('pointerdown', (e) => {
  if (dragging) return;
  if (!recentsLatched && !panelsLatched) return;
  if (e.target.closest('.preview-card')) return;
  if (e.target.closest('#dock')) return;
  if (e.target.closest('#panels')) return;
  if (e.target.closest('#deadzone')) return;
  if (e.target.closest('#swipe-zone')) return;
  if (recentsLatched) unlatchRecents();
  if (panelsLatched) hidePanels();
});

/* ===================== corner toggles ===================== */
function wireToggle(id, cls, labelOn, labelOff, startOn) {
  const el = document.getElementById(id);
  if (startOn) frame.classList.add(cls);
  el.textContent = startOn ? labelOn : labelOff;
  el.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    const on = frame.classList.toggle(cls);
    el.textContent = on ? labelOn : labelOff;
  });
}
wireToggle('dock-fill-toggle', 'dock-bare',  'Dock BG: OFF', 'Dock BG: ON',  true);
wireToggle('edge-toggle',      'show-edges', 'Edges: ON',    'Edges: OFF',   false);

buildRecentsPreview();
</script>
